[project]
name = "qwen3-asr-refinder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.12.0",
    "click>=8.4.2",
    "datasets>=5.0.1",
    "duckdb>=1.4.3",
    "peft>=0.18.1",
    "python-dotenv>=1.2.1",
    "torch>=2.9.1",
    "tqdm>=4.70.0",
    "transformers>=5.0.0",
    "trl>=0.28.0",
    "wandb>=0.24.0",
]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[dependency-groups]
dev = [
    "hf>=1.28.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
